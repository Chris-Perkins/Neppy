[project]
name = "neppy"
version = "0.1.0"
description = "Personal assistant made by Nep P"
readme = "README.md"
authors = [{ name = "Nep", email = "nepperkins@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.5.1",
    "cryptography==50.0.1",
    "google-api-core==2.36.0",
    "google-api-python-client==2.200.0",
    "google-auth==2.58.0",
    "google-auth-httplib2==0.4.2",
    "google-auth-oauthlib==1.4.1",
    "googleapis-common-protos==1.75.3",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httplib2==0.32.0",
    "httpx==0.28.1",
    "idna==3.19",
    "oauthlib==3.3.1",
    "ollama==0.6.2",
    "opentelemetry-api==1.44.0",
    "proto-plus==1.28.4",
    "protobuf==7.36.1",
    "pyasn1==0.6.4",
    "pyasn1-modules==0.4.2",
    "pycparser==3.0",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pyparsing==3.3.2",
    "requests==2.34.2",
    "requests-oauthlib==2.0.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uritemplate==4.2.0",
    "urllib3==2.7.0",
]

[project.scripts]
neppy = "neppy:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]
