[project]
name = "neppy"
version = "0.1.0"
description = "Personal assistant made by Nep P"
readme = "README.md"
authors = [{ name = "Nep", email = "nepperkins@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "cryptography==50.0.2",
    "google-api-core==2.40.0",
    "google-api-python-client==2.201.0",
    "google-auth==2.59.1",
    "google-auth-httplib2==0.4.4",
    "google-auth-oauthlib==1.5.0",
    "googleapis-common-protos==1.75.5",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httplib2==0.32.0",
    "httpx==0.28.1",
    "idna==3.20",
    "laya>=0.3.4",
    "oauthlib==4.0.0",
    "ollama==0.6.3",
    "opentelemetry-api==1.45.0",
    "proto-plus==1.29.0",
    "protobuf==7.36.2",
    "pyasn1==0.6.4",
    "pyasn1-modules==0.4.2",
    "pycparser==3.0",
    "pydantic==2.13.5",
    "pydantic-core==2.46.5",
    "pyparsing==3.3.3",
    "requests==2.34.2",
    "requests-oauthlib==2.0.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.4",
    "uritemplate==4.2.0",
    "urllib3==2.8.0",
]

[project.scripts]
neppy = "neppy:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["D", "I", "E", "F"]

extend-ignore = [
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D105", # Missing docstring in magic method (e.g., __str__)
    "D107", # Missing docstring in __init__ (Google style docs them at the class level)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["neppy"]
from-first = true
combine-as-imports = true
